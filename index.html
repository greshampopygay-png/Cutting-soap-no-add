<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🧼 Soap Cutting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;cursor:none;
  font-family:-apple-system,sans-serif;font-weight:700;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#f0e2cc,#d8c4a0 55%,#b89a70);}
#hud{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 12px;}
.pill{background:#fff;border-radius:50px;padding:7px 14px;font-size:.95rem;color:#333;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;}
#bar-wrap{flex:1;height:13px;background:rgba(0,0,0,.18);border-radius:10px;overflow:hidden;}
#bar{height:100%;border-radius:10px;background:linear-gradient(90deg,#e65c00,#f9a825);width:100%;}
/* SOAP — fixed center, no JS sizing */
#soap-area{position:fixed;top:56px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;}
#soap-3d{position:relative;width:260px;}
/* TOP parallelogram */
#s-top{height:24px;background:#fcefd8;clip-path:polygon(22px 0,260px 0,238px 24px,0 24px);position:relative;z-index:2;}
/* ROW: front + right */
#s-row{display:flex;position:relative;z-index:1;}
#s-front{width:238px;height:320px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;background:#c87848;
  box-shadow:0 10px 28px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.3);}
#s-right{width:22px;height:320px;flex-shrink:0;border-radius:0 6px 6px 0;background:#a05c30;}
#s-shadow{height:16px;margin:8px auto 0;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.18) 0%,transparent 70%);width:200px;}
/* Shine on front */
#s-shine{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 55%);pointer-events:none;}
/* Cut strip */
#s-strip{position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;}
/* Emoji */
#s-emoji{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:0;opacity:0;pointer-events:none;}
/* Lines container */
#s-lines{position:absolute;inset:0;pointer-events:none;}
/* Slab */
#s-slab{position:absolute;left:0;width:238px;border-radius:10px;opacity:0;pointer-events:none;z-index:10;
  box-shadow:2px 2px 8px rgba(0,0,0,.18);overflow:hidden;}
#s-slab::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent);border-radius:10px;}
/* Knife */
#knife{position:fixed;z-index:999;pointer-events:none;display:none;font-size:48px;line-height:1;
  transform:rotate(-38deg) scaleX(-1);filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4));}
/* Chunks */
.ck{position:fixed;pointer-events:none;z-index:500;border-radius:5px;animation:ckfly .6s ease-out forwards;}
@keyframes ckfly{0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}}
.spt{position:fixed;z-index:600;pointer-events:none;font-size:1.3rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:sptA .8s ease-out forwards;}
@keyframes sptA{0%{opacity:1;transform:translateY(0)scale(1);}100%{opacity:0;transform:translateY(-55px)scale(1.2);}}
/* Buttons */
#btns{position:fixed;bottom:12px;left:10px;z-index:200;display:flex;flex-direction:column;gap:7px;}
.bb{border-radius:50px;padding:9px 16px;font-size:.82rem;box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:none;font-family:inherit;font-weight:700;white-space:nowrap;}
.bb:active{transform:scale(.93);}
.bb-gold{background:linear-gradient(135deg,#f9a825,#e65c00);color:#fff;}
.bb-blue{background:linear-gradient(135deg,#42a5f5,#1565c0);color:#fff;}
.bb-green{background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}
#hint{position:fixed;bottom:18px;right:12px;color:rgba(0,0,0,.25);font-size:.78rem;pointer-events:none;z-index:50;}
#toast{position:fixed;bottom:175px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:7px 18px;border-radius:50px;font-size:.78rem;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;}
#toast.show{opacity:1;}
/* Overlays */
.ov{display:none;position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
.ov.on{display:flex;}
.card{background:linear-gradient(135deg,#fffaf4,#ffe8c4);border-radius:26px;padding:32px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes wpop{from{transform:scale(.3)rotate(-10deg);}to{transform:scale(1)rotate(0);}}
#wem{font-size:5rem;display:block;margin-bottom:8px;animation:eb .6s .1s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.5rem;color:#333;margin-bottom:4px;}.ws{color:#aaa;font-size:.85rem;margin-bottom:18px;}
.wbtn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;border-radius:50px;padding:12px 36px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;}
#ad-ov{display:none;position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.88);align-items:center;justify-content:center;}
#ad-ov.on{display:flex;}
.abox{background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:36px;text-align:center;width:min(310px,88%);}
.ah{font-size:1.4rem;color:#fff;margin-bottom:5px;}.ap{color:rgba(255,255,255,.4);font-size:.82rem;margin-bottom:16px;}
#adn{font-size:2.8rem;color:#f9a825;margin-bottom:14px;font-weight:900;}
#adbtn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;border-radius:50px;padding:12px 30px;font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;opacity:.3;pointer-events:none;transition:opacity .3s;}
#adbtn.on{opacity:1;pointer-events:all;}
#cpanel{display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.75);align-items:center;justify-content:center;}
#cpanel.on{display:flex;}
.cbox{background:#fff;border-radius:22px;width:min(360px,94%);max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.chead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
.chead h2{font-size:1.2rem;color:#333;margin:0;}
.cclose{width:34px;height:34px;border-radius:50%;background:#f0f0f0;border:none;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cstats{padding:8px 18px 0;font-size:.82rem;color:#999;flex-shrink:0;}
.cgrid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:12px 14px 18px;overflow-y:auto;flex:1;}
.ci{width:54px;height:54px;border-radius:14px;background:#f5f5f5;border:2px solid #eee;display:flex;align-items:center;justify-content:center;font-size:1.75rem;position:relative;}
.ci.found{background:linear-gradient(135deg,#fff9f0,#fff3e0);border:2px solid #f9a825;}
.ci.locked{filter:grayscale(1);opacity:.22;}
.ci .chk{position:absolute;bottom:2px;right:2px;font-size:.5rem;background:#4caf50;color:#fff;border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<div id="soap-area">
  <div id="soap-3d">
    <div id="s-top"></div>
    <div id="s-row">
      <div id="s-front">
        <div id="s-shine"></div>
        <div id="s-strip"></div>
        <div id="s-lines"></div>
        <div id="s-emoji"></div>
      </div>
      <div id="s-right"></div>
    </div>
    <div id="s-slab"></div>
    <div id="s-shadow"></div>
  </div>
</div>

<div id="knife">🔪</div>
<div id="hint">Веди ножом ↔</div>
<div id="toast">💾 Сохранено</div>

<div id="btns">
  <button class="bb bb-gold" onclick="openColl()">🏆 Коллекция</button>
  <a class="bb bb-blue" href="https://www.donationalerts.com/r/xeoni7" target="_blank" rel="noopener">❤️ Поддержать</a>
  <a class="bb bb-green" href="https://greshampopygay-png.github.io/I7-xeon-game-store-/" target="_blank" rel="noopener">🎮 Больше игр</a>
</div>

<div class="ov" id="win-ov">
  <div class="card">
    <span id="wem">🌟</span>
    <div class="wh" id="wh">Находка!</div>
    <div class="ws" id="ws">Уровень пройден</div>
    <button class="wbtn" onclick="goAd()">Следующий →</button>
  </div>
</div>

<div id="ad-ov">
  <div class="abox">
    <div style="font-size:3rem;margin-bottom:10px">📺</div>
    <div class="ah">Реклама...</div>
    <div class="ap">Подожди, скоро продолжим!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="goNext()">Продолжить →</button>
  </div>
</div>

<div id="cpanel">
  <div class="cbox">
    <div class="chead"><h2>🏆 Коллекция</h2><button class="cclose" onclick="closeColl()">✕</button></div>
    <div class="cstats">Найдено: <span id="cfound">0</span> / <span id="ctotal">0</span></div>
    <div class="cgrid" id="cgrid"></div>
  </div>
</div>

<script>
// AUDIO
var AC=null;
function ua(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function scrape(){if(!AC)return;try{var d=0.06,sr=AC.sampleRate,b=AC.createBuffer(1,Math.floor(sr*d),sr),dt=b.getChannelData(0);for(var i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.sin(i/dt.length*3.14)*0.5;var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700+Math.random()*500;var g=AC.createGain();g.gain.value=0.2;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+d);}catch(e){}}
function pop(){if(!AC)return;try{var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.2);g.gain.setValueAtTime(0.4,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.3);}catch(e){}}
function tring(){if(!AC)return;try{var t=AC.currentTime;[[1047,0],[1319,0.05],[1568,0.1]].forEach(function(p){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=p[0];g.gain.setValueAtTime(0,t+p[1]);g.gain.linearRampToValueAtTime(0.25,t+p[1]+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+p[1]+1.1);o.connect(g);g.connect(AC.destination);o.start(t+p[1]);o.stop(t+p[1]+1.2);});}catch(e){}}

// DATA
var TH=[
  {n:'Персиковое',f:'linear-gradient(180deg,#fcefd8 0%,#c87848 15%,#904020 100%)',t:'#fcefd8',r:'linear-gradient(180deg,#d89060,#7a3818)',s:'linear-gradient(180deg,#fcefd8,#c87848)',c:['#c87848','#f5ddb0','#d89060']},
  {n:'Синее',f:'linear-gradient(180deg,#d8f0ff 0%,#3a70c0 15%,#1a4890 100%)',t:'#d8f0ff',r:'linear-gradient(180deg,#5090d8,#1a3870)',s:'linear-gradient(180deg,#d8f0ff,#3a70c0)',c:['#3a70c0','#b0d8f5','#5090d8']},
  {n:'Мятное',f:'linear-gradient(180deg,#d8ffd0 0%,#38a050 15%,#186830 100%)',t:'#d8ffd0',r:'linear-gradient(180deg,#58c068,#185828)',s:'linear-gradient(180deg,#d8ffd0,#38a050)',c:['#38a050','#b8f0b0','#58c068']},
  {n:'Розовое',f:'linear-gradient(180deg,#ffd8e8 0%,#c03870 15%,#801850 100%)',t:'#ffd8e8',r:'linear-gradient(180deg,#d85888,#801848)',s:'linear-gradient(180deg,#ffd8e8,#c03870)',c:['#c03870','#f5b0c8','#d85888']},
  {n:'Лавандовое',f:'linear-gradient(180deg,#e8d8ff 0%,#7040c0 15%,#401890 100%)',t:'#e8d8ff',r:'linear-gradient(180deg,#9060d8,#401070)',s:'linear-gradient(180deg,#e8d8ff,#7040c0)',c:['#7040c0','#c8b0f5','#9060d8']},
  {n:'Шоколадное',f:'linear-gradient(180deg,#f5dcc0 0%,#7a4020 15%,#4a2010 100%)',t:'#f5dcc0',r:'linear-gradient(180deg,#a06030,#4a2008)',s:'linear-gradient(180deg,#f5dcc0,#7a4020)',c:['#7a4020','#c09060','#a06030']},
  {n:'Красное',f:'linear-gradient(180deg,#ffe0d8 0%,#d03020 15%,#901010 100%)',t:'#ffe0d8',r:'linear-gradient(180deg,#e05040,#901010)',s:'linear-gradient(180deg,#ffe0d8,#d03020)',c:['#d03020','#f09080','#e05040']},
  {n:'Жёлтое',f:'linear-gradient(180deg,#fffbd0 0%,#d4a800 15%,#9a7800 100%)',t:'#fffbd0',r:'linear-gradient(180deg,#f0c820,#9a7800)',s:'linear-gradient(180deg,#fffbd0,#d4a800)',c:['#d4a800','#f5e080','#f0c820']},
  {n:'Бирюзовое',f:'linear-gradient(180deg,#d0fff8 0%,#20a890 15%,#107860 100%)',t:'#d0fff8',r:'linear-gradient(180deg,#30c8a8,#107860)',s:'linear-gradient(180deg,#d0fff8,#20a890)',c:['#20a890','#90e8d8','#30c8a8']},
  {n:'Оранжевое',f:'linear-gradient(180deg,#fff0d0 0%,#e87020 15%,#a04010 100%)',t:'#fff0d0',r:'linear-gradient(180deg,#f09040,#a04010)',s:'linear-gradient(180deg,#fff0d0,#e87020)',c:['#e87020','#f8c080','#f09040']},
  {n:'Изумрудное',f:'linear-gradient(180deg,#d0ffe8 0%,#208858 15%,#105830 100%)',t:'#d0ffe8',r:'linear-gradient(180deg,#30b870,#105830)',s:'linear-gradient(180deg,#d0ffe8,#208858)',c:['#208858','#80e0b0','#30b870']},
  {n:'Сиреневое',f:'linear-gradient(180deg,#f8d8ff 0%,#b040d0 15%,#801090 100%)',t:'#f8d8ff',r:'linear-gradient(180deg,#d060e8,#801090)',s:'linear-gradient(180deg,#f8d8ff,#b040d0)',c:['#b040d0','#e090f0','#d060e8']},
  {n:'Серебряное',f:'linear-gradient(180deg,#f0f4f8 0%,#8090a8 15%,#506070 100%)',t:'#f0f4f8',r:'linear-gradient(180deg,#a0b0c0,#506070)',s:'linear-gradient(180deg,#f0f4f8,#8090a8)',c:['#8090a8','#c0d0e0','#a0b0c0']},
  {n:'Золотое',f:'linear-gradient(180deg,#fff8d0 0%,#c89800 15%,#886800 100%)',t:'#fff8d0',r:'linear-gradient(180deg,#e0b820,#886800)',s:'linear-gradient(180deg,#fff8d0,#c89800)',c:['#c89800','#f0d860','#e0b820']},
  {n:'Радужное',f:'linear-gradient(180deg,#ffd0d0 0%,#d080c0 33%,#8080d0 66%,#80c0d0 100%)',t:'#ffd0e8',r:'linear-gradient(180deg,#d080c0,#8080d0)',s:'linear-gradient(180deg,#ffd0d0,#d080c0)',c:['#d080c0','#80c0d0','#f0a0d0']},
];
var RW=['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺','🔥','🍭','🎀','🐠','🦁','🐯','🐸','🦜','🦩','🌸','🍓','🍇','🍉','🎸','🎺','🎻','🎹','🥁','🎨','🎪','🎠','🎡','🎢','🚀','🛸','🌍','🌊','🦅','🐙','🦑','🐡','🦈','🌋','🏔️'];
var TOTAL=8, LH=40; // fixed layer height px

// STATE
var level=1,score=0,coll=[];
var th=TH[0],rw='😊';
var done=0,pct=0,canCut=true,active=false,lastX=0,stk=0;

// SAVE/LOAD
function save(){try{localStorage.setItem('sc_l',level);localStorage.setItem('sc_s',score);localStorage.setItem('sc_c',JSON.stringify(coll));var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}catch(e){}}
function load(){try{var l=localStorage.getItem('sc_l'),s=localStorage.getItem('sc_s'),c=localStorage.getItem('sc_c');if(l)level=parseInt(l)||1;if(s)score=parseInt(s)||0;if(c)coll=JSON.parse(c)||[];}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);

// ELEMENTS
var eTop=document.getElementById('s-top');
var eFront=document.getElementById('s-front');
var eRight=document.getElementById('s-right');
var eStrip=document.getElementById('s-strip');
var eLines=document.getElementById('s-lines');
var eEmoji=document.getElementById('s-emoji');
var eSlab=document.getElementById('s-slab');
var eBar=document.getElementById('bar');
var eKnife=document.getElementById('knife');

// RENDER
function render(){
  var rem=TOTAL-done;
  var fH=rem*LH;
  var slH=Math.round(pct*LH);
  var slOX=Math.round(pct*48);
  var slOY=Math.round(pct*15);

  // top face
  eTop.style.background=th.t;

  // front face
  eFront.style.height=fH+'px';
  eFront.style.background=th.f;

  // right face — height matches front
  eRight.style.height=fH+'px';
  eRight.style.background=th.r;
  eRight.style.clipPath='none';

  // cut strip
  var stH=(done>0||pct>0.05)?Math.round(Math.min(LH*.5,fH*.2)):0;
  eStrip.style.height=stH+'px';
  eStrip.style.background='linear-gradient(180deg,'+th.t+',transparent)';

  // layer lines
  eLines.innerHTML='';
  for(var l=1;l<rem;l++){
    var d=document.createElement('div');
    d.style.cssText='position:absolute;left:8px;right:8px;top:'+(l*LH)+'px;height:1.5px;background:rgba(0,0,0,.09);';
    eLines.appendChild(d);
  }

  // emoji
  var ep=done/TOTAL;
  if(done>0){eEmoji.textContent=rw;eEmoji.style.fontSize=Math.round(10+ep*32)+'px';eEmoji.style.opacity=Math.min(1,ep*2.5);}
  else{eEmoji.style.fontSize='0';eEmoji.style.opacity='0';}

  // slab
  if(slH>1&&pct<1){
    eSlab.style.opacity='1';
    eSlab.style.height=slH+'px';
    eSlab.style.top=(24-slH+slOY)+'px'; // 24 = top face height
    eSlab.style.left=slOX+'px';
    eSlab.style.background=th.s;
  } else {
    eSlab.style.opacity='0';
  }

  // bar
  var bp=Math.max(0,(rem*LH-pct*LH)/(TOTAL*LH));
  eBar.style.width=(bp*100)+'%';
}

// INPUT — touch on whole screen
// Only attach cutting events to the soap area, not buttons/overlays
var soapArea = document.getElementById('soap-area');

function isInteractive(el){
  while(el){
    if(el.tagName==='BUTTON'||el.tagName==='A'||el.id==='btns'||el.id==='win-ov'||el.id==='ad-ov'||el.id==='cpanel')return true;
    el=el.parentElement;
  }
  return false;
}

soapArea.addEventListener('mousedown',function(e){
  if(isInteractive(e.target))return;
  ua();active=true;lastX=e.clientX;
});
soapArea.addEventListener('touchstart',function(e){
  if(isInteractive(e.target))return;
  e.preventDefault();ua();active=true;lastX=e.touches[0].clientX;
},{passive:false});
document.addEventListener('mousemove',function(e){
  eKnife.style.display='block';eKnife.style.left=(e.clientX-28)+'px';eKnife.style.top=(e.clientY-46)+'px';
  if(active&&canCut)cut(e.clientX,e.clientY);
});
soapArea.addEventListener('touchmove',function(e){
  if(!active)return;
  e.preventDefault();
  var x=e.touches[0].clientX,y=e.touches[0].clientY;
  eKnife.style.display='block';eKnife.style.left=(x-28)+'px';eKnife.style.top=(y-46)+'px';
  if(active&&canCut)cut(x,y);
},{passive:false});
document.addEventListener('mouseup',function(){active=false;});
document.addEventListener('touchend',function(){active=false;eKnife.style.display='none';});

function cut(x,y){
  var dx=Math.abs(x-lastX);
  lastX=x;
  if(dx<1)dx=3; // ensure minimum progress even on small moves
  pct=Math.min(1,pct+dx*0.012);
  stk++;if(stk%3===0)scrape();
  if(Math.random()<0.5)chunk(x,y,false);
  render();
  if(pct>=1)finishLayer(x,y);
}

// PARTICLES
function chunk(x,y,big){
  var n=big?5:1;
  for(var i=0;i<n;i++){
    var el=document.createElement('div');el.className='ck';
    var s=big?8+Math.random()*18:4+Math.random()*10;
    var col=th.c[Math.floor(Math.random()*th.c.length)];
    el.style.cssText='width:'+s+'px;height:'+(s*(0.4+Math.random()*.8))+'px;left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;background:'+col+';border-radius:'+(Math.random()>.4?'50%':'4px')+';';
    var a=-0.5+(Math.random()-.5)*2.2,dist=(big?55:25)+Math.random()*90;
    el.style.setProperty('--x',Math.cos(a)*dist+'px');
    el.style.setProperty('--y',Math.sin(a)*dist+30+Math.random()*30+'px');
    el.style.setProperty('--r',(Math.random()*480-240)+'deg');
    document.body.appendChild(el);
    (function(e){setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},700);})(el);
  }
}
function spt(txt,x,y){
  var el=document.createElement('div');el.className='spt';el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  (function(e){setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},900);})(el);
}

// FINISH LAYER
function finishLayer(px,py){
  canCut=false;active=false;pop();
  for(var i=0;i<20;i++){(function(ii){setTimeout(function(){chunk(px+(Math.random()-.5)*160,py+(Math.random()-.5)*60,true);},ii*25);})(i);}
  var pts=50+done*12;score+=pts;document.getElementById('hscore').textContent=score;spt('+'+pts,px,py-36);
  setTimeout(function(){
    done++;pct=0;
    if(done>=TOTAL){if(coll.indexOf(rw)===-1)coll.push(rw);save();setTimeout(showWin,350);}
    else{canCut=true;render();}
  },600);
}

// WIN/AD
function showWin(){document.getElementById('knife').style.display='none';document.getElementById('wem').textContent=rw;document.getElementById('wh').textContent='Находка: '+rw;document.getElementById('ws').textContent=th.n+' мыло · Уровень '+level;document.getElementById('win-ov').classList.add('on');tring();setTimeout(tring,380);}
function goAd(){document.getElementById('win-ov').classList.remove('on');level++;save();initLevel();}
function goNext(){document.getElementById('ad-ov').classList.remove('on');level++;save();initLevel();}

// COLLECTION
function openColl(){
  var grid=document.getElementById('cgrid');grid.innerHTML='';var found=0;
  RW.forEach(function(em){
    var ok=coll.indexOf(em)!==-1;if(ok)found++;
    var div=document.createElement('div');div.className='ci '+(ok?'found':'locked');div.textContent=em;
    if(ok){var chk=document.createElement('div');chk.className='chk';chk.textContent='✓';div.appendChild(chk);}
    grid.appendChild(div);
  });
  document.getElementById('cfound').textContent=found;document.getElementById('ctotal').textContent=RW.length;
  document.getElementById('cpanel').classList.add('on');
}
function closeColl(){document.getElementById('cpanel').classList.remove('on');}

// INIT
function initLevel(){
  th=TH[(level-1)%TH.length];
  var unused=RW.filter(function(r){return coll.indexOf(r)===-1;});
  rw=unused.length>0?unused[Math.floor(Math.random()*unused.length)]:RW[Math.floor(Math.random()*RW.length)];
  done=0;pct=0;canCut=true;active=false;stk=0;
  document.getElementById('hlvl').textContent=level;
  document.getElementById('hscore').textContent=score;
  render();
}

load();
window.addEventListener("load", function(){ initLevel(); });
</script>
